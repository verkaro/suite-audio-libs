[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/verkaro/suite-audio-libs"

[workspace.dependencies]
as-conv = { path = "crates/conv" }
as-draw = { path = "crates/draw" }
as-flac = { path = "crates/flac" }
as-http = { path = "crates/http" }
as-ir = { path = "crates/ir" }
as-jack-keeper = { path = "crates/jack-keeper" }
as-keep = { path = "crates/keep" }
as-meter = { path = "crates/meter" }
as-opening = { path = "crates/opening" }
as-page-kit = { path = "crates/page-kit" }
as-resample = { path = "crates/resample" }
as-tar = { path = "crates/tar" }
as-seam = { path = "crates/seam" }
as-tilt = { path = "crates/tilt" }
as-wav = { path = "crates/wav" }
as-ws = { path = "crates/ws" }
claxon = "0.4.3"
jack = "0.13"
libc = "0.2"
# Transcendentals the same on every machine (Tape's determinism rules, RFC section 9).
libm = "0.2"
realfft = "3.5"
rtrb = "0.3"

# FLAC written and read, and rates converted, are arithmetic a sample at a time: unoptimised, the
# tests crawl.
[profile.dev.package.as-flac]
opt-level = 3
[profile.dev.package.claxon]
opt-level = 3
[profile.dev.package.as-resample]
opt-level = 3
[profile.dev.package.as-conv]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
